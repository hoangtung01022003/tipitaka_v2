<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng ký - Tipiṭaka</title>
    <link rel="stylesheet" href="/static/style.css?v=20260826-1" />
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f8f2e9;
      }
      .loginCard {
        background: white;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        width: 100%;
        max-width: 400px;
      }
      .loginCard h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 1.5rem;
        text-align: center;
        color: #171411;
      }
      .formGroup {
        margin-bottom: 1rem;
      }
      .formGroup label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        color: #374151;
      }
      .formGroup input {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 1rem;
        box-sizing: border-box;
      }
      .formGroup small {
        display: block;
        margin-top: 0.35rem;
        color: #8a8175;
        font-size: 0.8rem;
      }
      .submitBtn {
        width: 100%;
        padding: 0.75rem;
        background-color: #9f3232;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        margin-top: 0.5rem;
      }
      .submitBtn:hover {
        background-color: #882a2a;
      }
      .errorMsg {
        background-color: #fee2e2;
        color: #dc2626;
        padding: 0.75rem;
        border-radius: 8px;
        margin-bottom: 1rem;
        text-align: center;
        font-size: 0.875rem;
      }
      .switchLink {
        display: block;
        text-align: center;
        margin-top: 1rem;
        font-size: 0.9rem;
        color: #9f3232;
      }
      .formGroup input.fieldInvalid {
        border-color: #dc2626;
      }
      .fieldError {
        display: none;
        margin-top: 0.35rem;
        color: #dc2626;
        font-size: 0.8rem;
      }
      .fieldError.visible {
        display: block;
      }
    </style>
    <link rel="stylesheet" href="/static/admin-mobile.css?v=20260813-responsive" />
  </head>
  <body>
    <div class="loginCard">
      <h1>Đăng ký tài khoản</h1>
      {% if error %}
        <div class="errorMsg">{{ error }}</div>
      {% endif %}
      <form method="POST" action="/register" id="registerForm" novalidate>
        <input type="hidden" name="next" value="{{ next }}" />
        <div class="formGroup">
          <label for="username">Tên đăng nhập</label>
          <input type="text" id="username" name="username" minlength="3" maxlength="32" required autofocus value="{{ username or '' }}" />
        </div>
        <div class="formGroup">
          <label for="password">Mật khẩu</label>
          <input type="password" id="password" name="password" minlength="6" required />
        </div>
        <div class="formGroup">
          <label for="confirm_password">Xác nhận mật khẩu</label>
          <input type="password" id="confirm_password" name="confirm_password" minlength="6" required />
          <p class="fieldError" id="confirmError">Mật khẩu xác nhận không khớp.</p>
        </div>
        <button type="submit" class="submitBtn">Đăng ký</button>
      </form>
      <a class="switchLink" href="/login?next={{ next | urlencode }}">Đã có tài khoản? Đăng nhập</a>
      <a class="switchLink" href="/">← Về trang tìm kiếm</a>
    </div>

    <script>
      const form = document.getElementById("registerForm");
      const password = document.getElementById("password");
      const confirmPassword = document.getElementById("confirm_password");
      const confirmError = document.getElementById("confirmError");

      function checkMatch() {
        const mismatched = confirmPassword.value.length > 0 && confirmPassword.value !== password.value;
        confirmPassword.classList.toggle("fieldInvalid", mismatched);
        confirmError.classList.toggle("visible", mismatched);
        return !mismatched;
      }

      password.addEventListener("input", checkMatch);
      confirmPassword.addEventListener("input", checkMatch);

      form.addEventListener("submit", (event) => {
        if (!checkMatch() || confirmPassword.value !== password.value) {
          event.preventDefault();
          confirmPassword.classList.add("fieldInvalid");
          confirmError.classList.add("visible");
          confirmPassword.focus();
        }
      });
    </script>
  </body>
</html>
