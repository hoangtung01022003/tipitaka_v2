<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng nhập - Tipiṭaka</title>
    <link rel="stylesheet" href="/static/style.css?v=20260826-1" />
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f8f2e9;
      }
      .loginCard {
        background: white;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        width: 100%;
        max-width: 400px;
      }
      .loginCard h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 1.5rem;
        text-align: center;
        color: #171411;
      }
      .formGroup {
        margin-bottom: 1rem;
      }
      .formGroup label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        color: #374151;
      }
      .formGroup input {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 1rem;
        box-sizing: border-box;
      }
      .submitBtn {
        width: 100%;
        padding: 0.75rem;
        background-color: #9f3232;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        margin-top: 0.5rem;
      }
      .submitBtn:hover {
        background-color: #882a2a;
      }
      .errorMsg {
        background-color: #fee2e2;
        color: #dc2626;
        padding: 0.75rem;
        border-radius: 8px;
        margin-bottom: 1rem;
        text-align: center;
        font-size: 0.875rem;
      }
      .switchLink {
        display: block;
        text-align: center;
        margin-top: 1rem;
        font-size: 0.9rem;
        color: #9f3232;
      }
    </style>
    <link rel="stylesheet" href="/static/admin-mobile.css?v=20260813-responsive" />
  </head>
  <body>
    <div class="loginCard">
      <h1>Đăng nhập</h1>
      {% if error %}
        <div class="errorMsg">{{ error }}</div>
      {% endif %}
      <form method="POST" action="/login">
        <input type="hidden" name="next" value="{{ next }}" />
        <div class="formGroup">
          <label for="username">Tên đăng nhập</label>
          <input type="text" id="username" name="username" required autofocus value="{{ username or '' }}" />
        </div>
        <div class="formGroup">
          <label for="password">Mật khẩu</label>
          <input type="password" id="password" name="password" required />
        </div>
        <button type="submit" class="submitBtn">Đăng nhập</button>
      </form>
      <a class="switchLink" href="/register?next={{ next | urlencode }}">Chưa có tài khoản? Đăng ký</a>
      <a class="switchLink" href="/">← Về trang tìm kiếm</a>
    </div>
  </body>
</html>
