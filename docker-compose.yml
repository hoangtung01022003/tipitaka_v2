services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: tipitaka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tipitaka_ai
    ports:
      - "5434:5432"
    volumes:
      - tipitaka_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tipitaka_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tipitaka_postgres_data:
