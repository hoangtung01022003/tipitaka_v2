worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Hỗ trợ WebSocket / HTTP streaming connection upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Mặc định nginx chỉ nhận tối đa 1MB/request - đủ cho form thường nhưng chặn ngay
    # khi admin tải PDF lên /admin/library/upload (413 Request Entity Too Large).
    # 0 = không giới hạn dung lượng.
    client_max_body_size 0;

    # Chuyển hướng HTTP sang HTTPS
    server {
        listen       80;
        server_name  suttasearch.net www.suttasearch.net;
        
        # Cho phép Win-Acme xác thực SSL tự động bằng Webroot filesystem
        location /.well-known/acme-challenge/ {
            root html;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Cấu hình HTTPS
    server {
        listen       443 ssl;
        server_name  suttasearch.net www.suttasearch.net;

        # Đường dẫn tới chứng chỉ SSL (do Win-Acme tạo ra)
        ssl_certificate      ../../nginx_config/certs/suttasearch.net-chain.pem;
        ssl_certificate_key  ../../nginx_config/certs/suttasearch.net-key.pem;

        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  1d;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Reverse Proxy Keepalive & WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
