worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Chuyển hướng HTTP sang HTTPS
    server {
        listen       80;
        server_name  suttasearch.net www.suttasearch.net;
        
        # Cho phép Win-Acme xác thực SSL (nếu cần dùng webroot)
        location /.well-known/acme-challenge/ {
            root html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Cấu hình HTTPS
    server {
        listen       443 ssl;
        server_name  suttasearch.net www.suttasearch.net;

        # Đường dẫn tới chứng chỉ SSL (sẽ được Win-Acme tạo ra)
        ssl_certificate      ../../nginx_config/certs/suttasearch.net-chain.pem;
        ssl_certificate_key  ../../nginx_config/certs/suttasearch.net-key.pem;

        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        ssl_ciphers  HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
