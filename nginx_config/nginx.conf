worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Mặc định nginx chỉ nhận tối đa 1MB/request - đủ cho form thường nhưng chặn ngay
    # khi admin tải PDF lên /admin/library/upload (413 Request Entity Too Large).
    # 0 = không giới hạn dung lượng.
    client_max_body_size 0;

    server {
        listen       80;
        server_name  suttasearch.net www.suttasearch.net;

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Optional: serve static files directly through Nginx
        # location /static/ {
        #     alias C:/Path/To/Your/Project/app/static/;
        # }
    }
}
