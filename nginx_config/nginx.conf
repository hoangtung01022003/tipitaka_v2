worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Hỗ trợ WebSocket / HTTP streaming connection upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Mặc định nginx chỉ nhận tối đa 1MB/request - đủ cho form thường nhưng chặn ngay
    # khi admin tải PDF lên /admin/library/upload (413 Request Entity Too Large).
    # 0 = không giới hạn dung lượng.
    client_max_body_size 0;

    server {
        listen       80;
        server_name  suttasearch.net www.suttasearch.net;

        # Cho phép Win-Acme xác thực SSL tự động bằng Webroot filesystem
        location /.well-known/acme-challenge/ {
            root html;
            try_files $uri =404;
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Reverse Proxy Keepalive & WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Optional: serve static files directly through Nginx
        # location /static/ {
        #     alias C:/Path/To/Your/Project/app/static/;
        # }
    }
}
